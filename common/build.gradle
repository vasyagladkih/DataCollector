plugins {
    id 'java-library'
    alias(libs.plugins.openapi.processor)
}

group = 'ru'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api platform(libs.spring.boot.dependencies)
    api 'org.springframework:spring-web'
    api 'org.springframework:spring-context'
    api 'jakarta.validation:jakarta.validation-api'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api libs.jspecify
    api libs.mapstruct
    annotationProcessor libs.mapstruct.processor

    api libs.tinkoff.sdk.contract

    compileOnly libs.jakarta.annotation.api

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

openapiProcessor {
    apiPath layout.projectDirectory.file("src/main/resources/openapi.yaml")

    spring {
        processor "${libs.openapi.processor.spring.get()}"
        targetDir layout.buildDirectory.dir("generated/src/main/java")
        mapping layout.projectDirectory.file("src/main/resources/mapping.yaml")
    }
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}

compileJava.dependsOn 'processSpring'
